name: Generate questions
on:
  workflow_dispatch:
    inputs:
      count:
        description: "Total number of AI questions to have in the bank"
        default: "1000"
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Convert Laws PDF to text
        run: |
          test -f tools/laws.pdf || { echo "HATA: tools/laws.pdf yok. IFAB Oyun Kuralları PDF'ini tools klasörüne laws.pdf adıyla yükleyin."; exit 1; }
          test -n "$ANTHROPIC_API_KEY" || { echo "HATA: ANTHROPIC_API_KEY secret tanımlı değil."; exit 1; }
          sudo apt-get update && sudo apt-get install -y poppler-utils
          pdftotext -layout tools/laws.pdf tools/laws.txt
      - name: Generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 tools/generate_questions.py --laws tools/laws.txt --count ${{ github.event.inputs.count }}
      - name: Commit question bank
        run: |
          git config user.name "question-bot"
          git config user.email "bot@users.noreply.github.com"
          git add app/src/main/assets/questions.json
          git commit -m "Update AI question bank" || echo "nothing to commit"
          git push
